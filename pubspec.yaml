name: hesabu
description: Private, on-device business analysis for Kenyan small businesses.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.8.0
  crypto: ^3.0.8
  file_selector: ^1.1.0
  pdfrx_engine: ^0.8.0
  pdfium_flutter: ^0.4.0
  pdfium_dart: ^0.4.0
  ffi: ^2.2.0
  url_launcher: ^6.3.2
  excel_plus: ^2.29.3
  pdf: ^3.13.1
  file_saver: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/glass_refraction.frag

# Bundle encryption-capable SQLite on Windows AND Android. Never replace this
# with plain sqlite3: startup and tests deliberately fail without SQLCipher.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
