name: bizlens
description: Private, on-device business analysis for Kenyan small businesses.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Bundle encryption-capable SQLite on Windows AND Android. Never replace this
# with plain sqlite3: startup and tests deliberately fail without SQLCipher.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
